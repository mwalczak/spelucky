name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Run tests and build APK
        run: ./gradlew testDebugUnitTest assembleDebug --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk spelucky.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: spelucky-apk
          path: spelucky.apk

      # Every push to main (or a manual "Run workflow" on main) becomes a GitHub Release,
      # so the newest APK is always at
      # https://github.com/<owner>/<repo>/releases/latest/download/spelucky.apk
      - name: Publish release
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Spelucky build ${{ github.run_number }}
          body: "Built from ${{ github.sha }}. Download spelucky.apk on the tablet and open it to install."
          files: spelucky.apk
          make_latest: true
